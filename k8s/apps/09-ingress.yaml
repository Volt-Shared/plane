# =============================================================================
# 09-ingress.yaml — Final "Bullet-Proof" Ingress Configuration
# =============================================================================

# --- 1. CORE PLANE INGRESS (Handles UI, API, Storage) ---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: plane-ingress
  namespace: plane
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-cloudflare"
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - plane.foodifytn.app
      secretName: plane-tls-prod
  rules:
    - host: plane.foodifytn.app
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: plane-api
                port:
                  number: 8000
          - path: /auth
            pathType: Prefix
            backend:
              service:
                name: plane-api
                port:
                  number: 8000
          - path: /plane-storage
            pathType: Prefix
            backend:
              service:
                name: plane-minio
                port:
                  number: 9000
          - path: /live
            pathType: Prefix
            backend:
              service:
                name: plane-live
                port:
                  number: 3000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: plane-web
                port:
                  number: 3000

---

# --- 2. CHAT-SERVICE INGRESS (strip /chat-svc prefix) ---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: plane-chat-svc-ingress
  namespace: plane
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-cloudflare"
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2

spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - plane.foodifytn.app
      secretName: plane-tls-prod
  rules:
    - host: plane.foodifytn.app
      http:
        paths:
          - path: /chat-svc(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: plane-chat-service
                port:
                  number: 4000

---

# --- 3. ROCKET.CHAT UI INGRESS (/chat/* direct) ---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: plane-rocketchat-ingress
  namespace: plane
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-cloudflare"
    nginx.ingress.kubernetes.io/use-regex: "true"

    # Boss-Mode iframe headers for chat rendering inside Plane.
    nginx.ingress.kubernetes.io/configuration-snippet: |
      proxy_hide_header X-Frame-Options;
      proxy_hide_header Content-Security-Policy;
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header Content-Security-Policy "frame-ancestors 'self' https://plane.foodifytn.app;" always;

spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - plane.foodifytn.app
      secretName: plane-tls-prod
  rules:
    - host: plane.foodifytn.app
      http:
        paths:
          - path: /chat(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: plane-rocketchat
                port:
                  number: 3000

---

# --- 4. ROCKET.CHAT SHORTCUT INGRESS (/group|/direct|/channel -> /chat/*) ---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: plane-rocketchat-shortcuts-ingress
  namespace: plane
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-cloudflare"
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /chat/$1$2$3

    # Keep iframe-compatible headers on rewritten chat pages as well.
    nginx.ingress.kubernetes.io/configuration-snippet: |
      proxy_hide_header X-Frame-Options;
      proxy_hide_header Content-Security-Policy;
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header Content-Security-Policy "frame-ancestors 'self' https://plane.foodifytn.app;" always;

spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - plane.foodifytn.app
      secretName: plane-tls-prod
  rules:
    - host: plane.foodifytn.app
      http:
        paths:
          - path: /(channel|group|direct)(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: plane-rocketchat
                port:
                  number: 3000