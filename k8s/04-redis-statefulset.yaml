# =============================================================================
# 04-redis-statefulset.yaml — Valkey (Redis-compatible) StatefulSet
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: plane-redis
  namespace: plane
  labels:
    app.kubernetes.io/name: plane-redis
    app.kubernetes.io/part-of: plane
spec:
  clusterIP: None
  ports:
    - port: 6379
      targetPort: 6379
      protocol: TCP
  selector:
    app.kubernetes.io/name: plane-redis
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: plane-redis
  namespace: plane
  labels:
    app.kubernetes.io/name: plane-redis
    app.kubernetes.io/part-of: plane
spec:
  serviceName: plane-redis
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: plane-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: plane-redis
    spec:
      containers:
        - name: redis
          image: valkey/valkey:7.2.11-alpine
          ports:
            - containerPort: 6379
          volumeMounts:
            - name: redisdata
              mountPath: /data
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 15
            periodSeconds: 30
  volumeClaimTemplates:
    - metadata:
        name: redisdata
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
