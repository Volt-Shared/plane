# =============================================================================
# 09-ingress.yaml — Nginx Ingress for Foodify (Fixed Routing)
# =============================================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: plane-ingress
  namespace: plane
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-cloudflare"
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/use-regex: "true"

    # Boss-Mode Iframe Fix: Strips backend headers and injects SAMEORIGIN + CSP
    nginx.ingress.kubernetes.io/configuration-snippet: |
      proxy_hide_header X-Frame-Options;
      proxy_hide_header Content-Security-Policy;
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header Content-Security-Policy "frame-ancestors 'self' https://plane.foodifytn.app;" always;

    # Link Rewrites (Forces UI paths to the /chat subpath in Rocket.Chat)
    nginx.ingress.kubernetes.io/server-snippet: |
      location ~* ^/(channel|group|direct) {
        rewrite ^/(.*)$ /chat/$1 break;
        proxy_pass http://plane-rocketchat.plane.svc.cluster.local:3000;
      }

spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - plane.foodifytn.app
      secretName: plane-tls-prod
  rules:
    - host: plane.foodifytn.app
      http:
        paths:
          # --- EXPLICIT CHAT ROUTING (Kills the 404) ---
          - path: /channel
            pathType: ImplementationSpecific
            backend:
              service:
                name: plane-rocketchat
                port:
                  number: 3000
          - path: /group
            pathType: ImplementationSpecific
            backend:
              service:
                name: plane-rocketchat
                port:
                  number: 3000
          - path: /direct
            pathType: ImplementationSpecific
            backend:
              service:
                name: plane-rocketchat
                port:
                  number: 3000
          - path: /chat
            pathType: ImplementationSpecific
            backend:
              service:
                name: plane-rocketchat
                port:
                  number: 3000

          # --- API & Auth ---
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: plane-api
                port:
                  number: 8000
          - path: /auth
            pathType: Prefix
            backend:
              service:
                name: plane-api
                port:
                  number: 8000

          # --- MinIO Storage ---
          - path: /plane-storage
            pathType: Prefix
            backend:
              service:
                name: plane-minio
                port:
                  number: 9000

          # --- Live / WebSockets ---
          - path: /live
            pathType: Prefix
            backend:
              service:
                name: plane-live
                port:
                  number: 3000

          # --- Frontend (Catch-all) ---
          - path: /
            pathType: Prefix
            backend:
              service:
                name: plane-web
                port:
                  number: 3000
---
# --- Chat-Service Ingress (Separate for Rewrite Target) ---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: plane-chat-svc-ingress
  namespace: plane
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-cloudflare"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    
    # Same Header Security for Auth Flow
    nginx.ingress.kubernetes.io/configuration-snippet: |
      proxy_hide_header X-Frame-Options;
      proxy_hide_header Content-Security-Policy;
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header Content-Security-Policy "frame-ancestors 'self' https://plane.foodifytn.app;" always;

spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - plane.foodifytn.app
      secretName: plane-tls-prod
  rules:
    - host: plane.foodifytn.app
      http:
        paths:
          - path: /chat-svc(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: plane-chat-service
                port:
                  number: 4000