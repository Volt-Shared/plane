# =============================================================================
# 07-plane-migrator.yaml — Database Migration Job
# =============================================================================
apiVersion: batch/v1
kind: Job
metadata:
  name: plane-migrator
  namespace: plane
  labels:
    app.kubernetes.io/name: plane-migrator
    app.kubernetes.io/part-of: plane
  annotations:
    # ArgoCD Hook: Runs the migration every time you sync the app
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
spec:
  backoffLimit: 5
  # Keeps the job logs around for 5 minutes after finishing, then deletes it
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: plane-migrator
    spec:
      restartPolicy: OnFailure
      
      # 1. Wait for Postgres to be ready so the migration doesn't crash immediately
      initContainers:
        - name: wait-for-db
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z plane-db 5432; do echo waiting for postgres; sleep 2; done"]
          
      containers:
        - name: migrator
          # Using your custom built image from the pipeline
          image: ghcr.io/volt-shared/volt-plane-backend:latest
          command: ["./bin/docker-entrypoint-migrator.sh"]
          envFrom:
            - configMapRef:
                name: plane-config
            - secretRef:
                name: plane-secrets
          env:
            # Explicitly building the URL to ensure the migration script knows where to go
            - name: DATABASE_URL
              value: "postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@plane-db:5432/$(POSTGRES_DB)"
            # Adding these explicitly since the "old working" one needed them
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef: { name: plane-secrets, key: AWS_ACCESS_KEY_ID }
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef: { name: plane-secrets, key: AWS_SECRET_ACCESS_KEY }