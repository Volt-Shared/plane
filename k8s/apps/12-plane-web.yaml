apiVersion: v1
kind: Service
metadata:
  name: plane-web
  namespace: plane
spec:
  ports:
    - port: 3000
  selector:
    app.kubernetes.io/name: plane-web
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: plane-web
  namespace: plane
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: plane-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: plane-web
    spec:
      containers:
        - name: web
          image: ghcr.io/volt-shared/volt-plane-web:latest
          envFrom:
            - configMapRef: { name: plane-config }