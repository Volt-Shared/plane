# =============================================================================
# 02-configmap.yaml — Non-sensitive configuration (Updated for Foodify)
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: plane-config
  namespace: plane
  labels:
    app.kubernetes.io/part-of: plane
data:
  DOMAIN: "plane.foodifytn.app"

  # ── Postgres ──────────────────
  POSTGRES_HOST: "plane-db"
  POSTGRES_PORT: "5432"
  PGDATA: "/var/lib/postgresql/data"

  # ── Redis ─────────────────────
  REDIS_HOST: "plane-redis"
  REDIS_PORT: "6379"
  REDIS_URL: "redis://plane-redis:6379/"

  # ── RabbitMQ ──────────────────
  RABBITMQ_HOST: "plane-mq"
  RABBITMQ_PORT: "5672"
  RABBITMQ_VHOST: "plane"

  # ── MinIO / S3 (The Foodify Fix) ──
  USE_S3: "1"
  USE_MINIO: "1"
  AWS_S3_ENDPOINT_URL: "http://plane-minio:9000"
  AWS_S3_BUCKET_NAME: "plane-storage" # Consistently using the one we made on VPS
  AWS_S3_PATH_STYLE: "true"
  AWS_S3_REGION: "us-east-1"
  AWS_S3_ACL: "None"
  FILE_SIZE_LIMIT: "5242880"
  MINIO_ENDPOINT_SSL: "0"

  # ── API (Gunicorn Fix) ─────────
  DEBUG: "0"
  DOCKERIZED: "1"
  GUNICORN_WORKERS: "2" # Lowered to 2 for VPS stability
  API_KEY_RATE_LIMIT: "60/minute"
  HARD_DELETE_AFTER_DAYS: "60"

  # ── URLs (Mapped to Foodify) ──
  WEB_URL: "https://plane.foodifytn.app"
  APP_BASE_URL: "https://plane.foodifytn.app"
  ADMIN_BASE_URL: "https://plane.foodifytn.app"
  ADMIN_BASE_PATH: "/god-mode"
  SPACE_BASE_URL: "https://plane.foodifytn.app"
  SPACE_BASE_PATH: "/spaces"
  LIVE_BASE_URL: "https://plane.foodifytn.app"
  LIVE_BASE_PATH: "/live"
  CORS_ALLOWED_ORIGINS: "https://plane.foodifytn.app"

  # ── Live server ───────────────
  LIVE_PORT: "3000"
  LIVE_API_BASE_URL: "http://plane-api:8000"
  LIVE_WEB_BASE_URL: "http://plane-web:3000"
  LIVE_LIVE_BASE_URL: "http://plane-live:3000"

  # ── Rocket.Chat ────────────────
  ROCKETCHAT_ROOT_URL: "https://plane.foodifytn.app/chat"
  ROCKETCHAT_INTERNAL_URL: "http://plane-rocketchat:3000/chat"
  ROCKETCHAT_ADMIN_EMAIL_CONFIG: "admin@plane.local"

  # ── Chat-service ───────────────
  CHAT_SERVICE_PORT: "4000"
  CHAT_SERVICE_LOG_LEVEL: "info"
  PLANE_API_INTERNAL_URL: "http://plane-api:8000"
  PLANE_WORKSPACE_SLUG: "volt"
  SYNC_CRON: "*/30 * * * *"
  NODE_ENV: "production"

  # ── Users ──────────────────────
  PLANE_USERS: |
    aziz@falcons.tn
    selim@falcons.tn
    taoufik@falcons.tn
    houssem@falcons.tn
    mortadha@falcons.tn
    faycel@falcons.tn
    ala@falcons.tn
    khalil@falcons.tn
    ahmed@falcons.tn
  PLANE_WORKSPACE_NAME: "Volt"