# ──────────────────────────────────────────────────────────────────────────────
# Rocket.Chat + Chat-Service overlay
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.rocketchat.yml up -d
#
# This file adds:
#   1. chat-mongodb    — MongoDB 6 replica-set (required by Rocket.Chat)
#   2. rocketchat      — Rocket.Chat 7.x server
#   3. chat-service    — Node.js microservice (Plane <-> RC glue: SSO, sync)
#
# NOTE: MongoDB runs WITHOUT authentication.  It is only reachable on the
# internal Docker bridge network, which is sufficient for local / self-hosted
# deployments.  For production on shared infrastructure, add a keyFile and
# MONGO_INITDB_ROOT_USERNAME/PASSWORD (see MongoDB docs).
# ──────────────────────────────────────────────────────────────────────────────

services:
  # ── MongoDB for Rocket.Chat ────────────────────────────────────────────────
  chat-mongodb:
    image: mongo:6.0
    container_name: chat-mongodb
    restart: always
    # Start mongod directly with replica-set flag (no auth).
    # The official entrypoint is bypassed so that MONGO_INITDB_* auth
    # logic does not inject --auth (which conflicts with replSet without a keyFile).
    entrypoint: ["mongod", "--replSet", "rs0", "--oplogSize", "128", "--bind_ip_all"]
    volumes:
      - chat_mongodata:/data/db
    healthcheck:
      # Initialise the replica set on first run; subsequent runs just check status.
      test: |
        mongosh --quiet --eval "
          try { rs.status().ok }
          catch(e) {
            rs.initiate({_id:'rs0', members:[{_id:0, host:'chat-mongodb:27017'}]});
            1;
          }
        "
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  # ── Rocket.Chat ────────────────────────────────────────────────────────────
  rocketchat:
    image: registry.rocket.chat/rocketchat/rocket.chat:7.5.1
    container_name: rocketchat
    restart: always
    depends_on:
      chat-mongodb:
        condition: service_healthy
    environment:
      # MongoDB connection (no auth, replica-set)
      MONGO_URL: mongodb://chat-mongodb:27017/rocketchat?replicaSet=rs0
      MONGO_OPLOG_URL: mongodb://chat-mongodb:27017/local?replicaSet=rs0

      # Root URL — through the Caddy proxy at /chat
      ROOT_URL: ${ROCKETCHAT_ROOT_URL:-http://localhost:8080/chat}
      PORT: "3000"

      # Auto-create admin on first boot
      ADMIN_USERNAME: ${ROCKETCHAT_ADMIN_USERNAME:-rocketadmin}
      ADMIN_PASS: ${ROCKETCHAT_ADMIN_PASSWORD:-rocketadmin_secret}
      ADMIN_EMAIL: ${ROCKETCHAT_ADMIN_EMAIL:-admin@plane.local}

      # Iframe SSO — RC calls api_url to get a login token, iframe_url as fallback.
      # Both must be set for iframe auth to activate.
      # The X-Frame-Options console warning is harmless — SSO works via api_url.
      OVERWRITE_SETTING_Accounts_iframe_enabled: "true"
      OVERWRITE_SETTING_Accounts_iframe_url: "http://localhost:8080/chat-svc/sso/rc-iframe-auth"
      # Prevent RC from opening hidden iframes that trigger X-Frame-Options
      OVERWRITE_SETTING_Accounts_iframe_api_method: "GET"
      OVERWRITE_SETTING_Accounts_Iframe_api_url: "http://localhost:8080/chat-svc/sso/rc-iframe-auth"
      OVERWRITE_SETTING_Accounts_Iframe_api_method: "GET"

      # CORS — allow Plane origin
      OVERWRITE_SETTING_CORS_Origin: "*"

      # Disable iframe postMessage integration (causes X-Frame-Options errors
      # when RC tries to load parent page in a hidden iframe). Not needed —
      # our SSO uses Accounts_Iframe_api_url instead.
      OVERWRITE_SETTING_Iframe_Integration_send_enable: "false"
      OVERWRITE_SETTING_Iframe_Integration_receive_enable: "false"
      OVERWRITE_SETTING_Iframe_Restrict: ""

      # Disable X-Frame-Options so we can iframe it
      OVERWRITE_SETTING_HTTP_X_Frame_Options: ""

      # Disable notification sounds (prevents autoplay errors in iframe)
      OVERWRITE_SETTING_Accounts_Default_User_Preferences_newRoomNotification: "none"
      OVERWRITE_SETTING_Accounts_Default_User_Preferences_newMessageNotification: "none"
      OVERWRITE_SETTING_Accounts_Default_User_Preferences_desktopNotifications: "nothing"

      # API rate limiting — be generous for sync operations
      OVERWRITE_SETTING_API_Enable_Rate_Limiter: "true"
      OVERWRITE_SETTING_API_Enable_Rate_Limiter_Limit_Calls_Default: "100"

      # Registration — only via API (chat-service handles it)
      OVERWRITE_SETTING_Accounts_RegistrationForm: "Disabled"

      # Disable 2FA / TOTP so programmatic login works
      OVERWRITE_SETTING_Accounts_TwoFactorAuthentication_Enabled: "false"
      OVERWRITE_SETTING_Accounts_TwoFactorAuthentication_By_Email_Enabled: "false"
      OVERWRITE_SETTING_Accounts_TwoFactorAuthentication_By_TOTP_Enabled: "false"

      # Site name
      OVERWRITE_SETTING_Site_Name: "Plane Chat"

    healthcheck:
      test: >
        /usr/local/bin/node -e "
          const http = require('http');
          http.get('http://localhost:3000/health', res => {
            process.exit(res.statusCode === 200 ? 0 : 1);
          }).on('error', () => process.exit(1));
        "
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 90s

  # ── Proxy override — inject env vars the Caddyfile needs ─────────────────
  proxy:
    env_file:
      - .env
    depends_on:
      - web
      - api
      - space
      - admin
      - rocketchat
      - chat-service

  # ── Chat-Service (Plane <-> Rocket.Chat bridge) ───────────────────────────
  chat-service:
    container_name: chat-service
    build:
      context: ./services/chat-service
      dockerfile: Dockerfile
    restart: always
    depends_on:
      rocketchat:
        condition: service_healthy
      plane-redis:
        condition: service_started
    env_file:
      - ./services/chat-service/.env
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  chat_mongodata:
