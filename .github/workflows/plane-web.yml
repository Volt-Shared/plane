name: deploy-web

on:
  push:
    branches: [ preview ]
    paths:
      - 'apps/web/**'
      - 'k8s/12-plane-web.yaml'

jobs:
  build-push-sync:
    runs-on: ubuntu-latest
    permissions: { contents: write, packages: write }
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.volt_infra_pat }}

      - name: login to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.volt_infra_pat }}

      - name: set vars
        id: vars
        run: |
          tag="web-${{ github.run_number }}"
          echo "tag=$tag" >> $GITHUB_OUTPUT
          echo "image=ghcr.io/volt-shared/volt-plane-web:$tag" >> $GITHUB_OUTPUT

      - name: build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/web/Dockerfile
          push: true
          tags: |
            ${{ steps.vars.outputs.image }}
            ghcr.io/volt-shared/volt-plane-web:latest

      - name: update k8s tag
        run: |
          sed -i "s|image: ghcr.io/volt-shared/volt-plane-web:.*|image: ${{ steps.vars.outputs.image }}|g" k8s/12-plane-web.yaml

      - name: git commit
        run: |
          git config user.name "volt-bot"
          git config user.email "actions@github.com"
          git add k8s/12-plane-web.yaml
          git commit -m "chore(ops): sync web image to ${{ steps.vars.outputs.tag }} [skip ci]" || echo "No changes"
          git push origin master
