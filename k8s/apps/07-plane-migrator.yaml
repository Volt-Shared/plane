apiVersion: batch/v1
kind: Job
metadata:
  name: plane-migrator
  namespace: plane
  labels:
    app.kubernetes.io/name: plane-migrator
    app.kubernetes.io/part-of: plane
spec:
  backoffLimit: 5
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: plane-migrator
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-db
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z plane-db 5432; do sleep 2; done"]
      containers:
        - name: migrator
          image: ghcr.io/volt-shared/volt-plane-backend:latest
          command: ["./bin/docker-entrypoint-migrator.sh"]
          envFrom:
            - configMapRef:
                name: plane-config
            - secretRef:
                name: plane-secrets
          env:
            - name: DATABASE_URL
              value: "postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@plane-db:5432/$(POSTGRES_DB)"
