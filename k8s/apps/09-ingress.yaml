# =============================================================================
# 09-ingress.yaml — Nginx Ingress for Foodify (Cloudflare Issuer)
# =============================================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: plane-ingress
  namespace: plane
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-cloudflare"
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    
    # Boss-Mode Iframe Fix: Strips backend headers and injects SAMEORIGIN + CSP
    nginx.ingress.kubernetes.io/configuration-snippet: |
      proxy_hide_header X-Frame-Options;
      proxy_hide_header Content-Security-Policy;
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header Content-Security-Policy "frame-ancestors 'self' https://plane.foodifytn.app;" always;
    
    # Link Rewrites for Chat
    nginx.ingress.kubernetes.io/server-snippet: |
      location ~ ^/(channel|group|direct)/(.*)$ {
        rewrite ^/(channel|group|direct)/(.*)$ /chat/$1/$2 last;
      }
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - plane.foodifytn.app
      secretName: plane-tls-prod
  rules:
    - host: plane.foodifytn.app
      http:
        paths:
          # --- API & Auth ---
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: plane-api
                port:
                  number: 8000
          - path: /auth
            pathType: Prefix
            backend:
              service:
                name: plane-api
                port:
                  number: 8000

          # --- MinIO Storage ---
          - path: /plane-storage
            pathType: Prefix
            backend:
              service:
                name: plane-minio
                port:
                  number: 9000

          # --- Live / WebSockets ---
          - path: /live
            pathType: Prefix
            backend:
              service:
                name: plane-live
                port:
                  number: 3000

          # --- Rocket.Chat ---
          - path: /chat
            pathType: Prefix
            backend:
              service:
                name: plane-rocketchat
                port:
                  number: 3000

          # --- Frontend (Catch-all) ---
          - path: /
            pathType: Prefix
            backend:
              service:
                name: plane-web
                port:
                  number: 3000
---
# --- Chat-Service Ingress (Separate for Rewrite Target) ---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: plane-chat-svc-ingress
  namespace: plane
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-cloudflare"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    
    # Boss-Mode Iframe Fix: Strips backend headers and injects SAMEORIGIN + CSP
    # This ensures the SSO auth frame is allowed to load
    nginx.ingress.kubernetes.io/configuration-snippet: |
      proxy_hide_header X-Frame-Options;
      proxy_hide_header Content-Security-Policy;
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header Content-Security-Policy "frame-ancestors 'self' https://plane.foodifytn.app;" always;

spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - plane.foodifytn.app
      secretName: plane-tls-prod
  rules:
    - host: plane.foodifytn.app
      http:
        paths:
          - path: /chat-svc(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: plane-chat-service
                port:
                  number: 4000