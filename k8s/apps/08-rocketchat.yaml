apiVersion: v1
kind: Service
metadata:
  name: plane-chat-mongodb
  namespace: plane
spec:
  clusterIP: None
  ports:
    - port: 27017
  selector:
    app.kubernetes.io/name: plane-chat-mongodb
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: plane-chat-mongodb
  namespace: plane
spec:
  serviceName: plane-chat-mongodb
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: plane-chat-mongodb
  template:
    metadata:
      labels:
        app.kubernetes.io/name: plane-chat-mongodb
    spec:
      containers:
        - name: mongo
          image: mongo:6.0
          command: ["mongod", "--replSet", "rs0", "--oplogSize", "128", "--bind_ip_all"]
          ports:
            - containerPort: 27017
          volumeMounts:
            - name: mongodata
              mountPath: /data/db
  volumeClaimTemplates:
    - metadata:
        name: mongodata
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: plane-rocketchat
  namespace: plane
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: plane-rocketchat
  template:
    metadata:
      labels:
        app.kubernetes.io/name: plane-rocketchat
    spec:
      containers:
        - name: rocketchat
          image: registry.rocket.chat/rocketchat/rocket.chat:7.5.1
          env:
            - name: MONGO_URL
              value: "mongodb://plane-chat-mongodb-0.plane-chat-mongodb.plane.svc.cluster.local:27017/rocketchat?replicaSet=rs0"
            - name: ROOT_URL
              value: "https://plane.foodifytn.app/chat"
            - name: PORT
              value: "3000"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: plane-chat-service
  namespace: plane
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: plane-chat-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: plane-chat-service
    spec:
      containers:
        - name: chat-service
          image: ghcr.io/volt-shared/volt-plane-chat-service:latest
          env:
            - name: ROCKETCHAT_URL
              value: "http://plane-rocketchat:3000/chat"
            - name: PLANE_API_URL
              value: "http://plane-api:8000"
          envFrom:
            - secretRef: { name: plane-secrets }
            - configMapRef: { name: plane-config }