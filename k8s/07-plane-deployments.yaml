# =============================================================================
# 07-plane-deployments.yaml — All Plane application components
#
# Components: migrator (Job), api, worker, beat, live, frontend (web),
#             admin, space
#
# IMPORTANT: Replace YOUR_REGISTRY with your container registry.
#   Build images locally:
#     docker build -f apps/web/Dockerfile.web -t YOUR_REGISTRY/plane-web:latest .
#     docker build -f apps/admin/Dockerfile.admin -t YOUR_REGISTRY/plane-admin:latest .
#     docker build -f apps/space/Dockerfile.space -t YOUR_REGISTRY/plane-space:latest .
#     docker build -f apps/api/Dockerfile.api -t YOUR_REGISTRY/plane-api:latest apps/api/
#     docker build -f apps/live/Dockerfile.live -t YOUR_REGISTRY/plane-live:latest .
# =============================================================================

# ─── Shared env helper (used by api, worker, beat, migrator) ────────────────
# We define the env block once as inline YAML anchors aren't standard K8s,
# so each deployment repeats the env section. To reduce duplication in
# practice, use Kustomize or Helm.

# =============================================================================
# MIGRATOR — one-time Job that runs Django migrations
# =============================================================================
apiVersion: batch/v1
kind: Job
metadata:
  name: plane-migrator
  namespace: plane
  labels:
    app.kubernetes.io/name: plane-migrator
    app.kubernetes.io/part-of: plane
spec:
  backoffLimit: 5
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: plane-migrator
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-db
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z plane-db 5432; do sleep 2; done"]
      containers:
        - name: migrator
          image: YOUR_REGISTRY/plane-api:latest
          command: ["./bin/docker-entrypoint-migrator.sh"]
          envFrom:
            - configMapRef:
                name: plane-config
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: plane-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: plane-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: plane-secrets
                  key: POSTGRES_DB
            - name: DATABASE_URL
              value: "postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@plane-db:5432/$(POSTGRES_DB)"
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: plane-secrets
                  key: SECRET_KEY
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: plane-secrets
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: plane-secrets
                  key: AWS_SECRET_ACCESS_KEY
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
# =============================================================================
# API — Django / Gunicorn
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: plane-api
  namespace: plane
  labels:
    app.kubernetes.io/name: plane-api
    app.kubernetes.io/part-of: plane
spec:
  ports:
    - port: 8000
      targetPort: 8000
  selector:
    app.kubernetes.io/name: plane-api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: plane-api
  namespace: plane
  labels:
    app.kubernetes.io/name: plane-api
    app.kubernetes.io/part-of: plane
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: plane-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: plane-api
    spec:
      initContainers:
        - name: wait-for-db
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z plane-db 5432; do sleep 2; done"]
        - name: wait-for-redis
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z plane-redis 6379; do sleep 2; done"]
      containers:
        - name: api
          image: YOUR_REGISTRY/plane-api:latest
          command: ["./bin/docker-entrypoint-api.sh"]
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: plane-config
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: plane-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: plane-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: plane-secrets
                  key: POSTGRES_DB
            - name: DATABASE_URL
              value: "postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@plane-db:5432/$(POSTGRES_DB)"
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: plane-secrets
                  key: SECRET_KEY
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: plane-secrets
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: plane-secrets
                  key: AWS_SECRET_ACCESS_KEY
            - name: RABBITMQ_USER
              valueFrom:
                secretKeyRef:
                  name: plane-secrets
                  key: RABBITMQ_USER
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: plane-secrets
                  key: RABBITMQ_PASSWORD
            - name: LIVE_SERVER_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: plane-secrets
                  key: LIVE_SERVER_SECRET_KEY
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /api/users/me/
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /api/users/me/
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
---
# =============================================================================
# WORKER — Celery background worker
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: plane-worker
  namespace: plane
  labels:
    app.kubernetes.io/name: plane-worker
    app.kubernetes.io/part-of: plane
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: plane-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: plane-worker
    spec:
      initContainers:
        - name: wait-for-api
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z plane-api 8000; do sleep 3; done"]
      containers:
        - name: worker
          image: YOUR_REGISTRY/plane-api:latest
          command: ["./bin/docker-entrypoint-worker.sh"]
          envFrom:
            - configMapRef:
                name: plane-config
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: plane-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: plane-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: plane-secrets
                  key: POSTGRES_DB
            - name: DATABASE_URL
              value: "postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@plane-db:5432/$(POSTGRES_DB)"
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: plane-secrets
                  key: SECRET_KEY
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: plane-secrets
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: plane-secrets
                  key: AWS_SECRET_ACCESS_KEY
            - name: RABBITMQ_USER
              valueFrom:
                secretKeyRef:
                  name: plane-secrets
                  key: RABBITMQ_USER
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: plane-secrets
                  key: RABBITMQ_PASSWORD
            - name: LIVE_SERVER_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: plane-secrets
                  key: LIVE_SERVER_SECRET_KEY
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
# =============================================================================
# BEAT — Celery beat scheduler (single replica!)
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: plane-beat
  namespace: plane
  labels:
    app.kubernetes.io/name: plane-beat
    app.kubernetes.io/part-of: plane
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: plane-beat
  template:
    metadata:
      labels:
        app.kubernetes.io/name: plane-beat
    spec:
      initContainers:
        - name: wait-for-api
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z plane-api 8000; do sleep 3; done"]
      containers:
        - name: beat
          image: YOUR_REGISTRY/plane-api:latest
          command: ["./bin/docker-entrypoint-beat.sh"]
          envFrom:
            - configMapRef:
                name: plane-config
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: plane-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: plane-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: plane-secrets
                  key: POSTGRES_DB
            - name: DATABASE_URL
              value: "postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@plane-db:5432/$(POSTGRES_DB)"
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: plane-secrets
                  key: SECRET_KEY
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: plane-secrets
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: plane-secrets
                  key: AWS_SECRET_ACCESS_KEY
            - name: RABBITMQ_USER
              valueFrom:
                secretKeyRef:
                  name: plane-secrets
                  key: RABBITMQ_USER
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: plane-secrets
                  key: RABBITMQ_PASSWORD
            - name: LIVE_SERVER_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: plane-secrets
                  key: LIVE_SERVER_SECRET_KEY
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 512Mi
---
# =============================================================================
# LIVE — WebSocket / collaboration server
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: plane-live
  namespace: plane
  labels:
    app.kubernetes.io/name: plane-live
    app.kubernetes.io/part-of: plane
spec:
  ports:
    - port: 3000
      targetPort: 3000
  selector:
    app.kubernetes.io/name: plane-live
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: plane-live
  namespace: plane
  labels:
    app.kubernetes.io/name: plane-live
    app.kubernetes.io/part-of: plane
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: plane-live
  template:
    metadata:
      labels:
        app.kubernetes.io/name: plane-live
    spec:
      containers:
        - name: live
          image: YOUR_REGISTRY/plane-live:latest
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: API_BASE_URL
              value: "http://plane-api:8000"
            - name: WEB_BASE_URL
              value: "http://plane-web:3000"
            - name: LIVE_BASE_URL
              value: "http://plane-live:3000"
            - name: LIVE_BASE_PATH
              value: "/live"
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: plane-config
                  key: REDIS_HOST
            - name: REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: plane-config
                  key: REDIS_PORT
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: plane-config
                  key: REDIS_URL
            - name: LIVE_SERVER_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: plane-secrets
                  key: LIVE_SERVER_SECRET_KEY
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 30
---
