# =============================================================================
# 10-init-job.yaml — One-shot job to create Plane users, workspace, and
#                     generate an API token for chat-service.
#
# Run AFTER the migrator job completes and the API is ready:
#   kubectl apply -f k8s/10-init-job.yaml
#
# This job:
#   1. Waits for the API to be reachable
#   2. Creates 9 user accounts with password "falcon2026"
#   3. Creates workspace "Volt" (slug: volt)
#   4. Adds all users to the workspace
#   5. Prints the API token (check logs: kubectl -n plane logs job/plane-init)
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: plane-init-script
  namespace: plane
  labels:
    app.kubernetes.io/part-of: plane
data:
  init_plane.py: |
    """
    Bootstrap Plane: instance, users, workspace, project, API token.
    Runs inside the API container image with Django available.
    """
    import os, sys, secrets

    # Suppress noisy middleware logs
    import logging
    logging.disable(logging.WARNING)

    from plane.db.models import (
        User, Workspace, WorkspaceMember, Project, ProjectMember, APIToken,
    )
    from plane.license.models import Instance

    PASSWORD = os.environ.get("USER_PASSWORD", "falcon2026")
    WORKSPACE_NAME = os.environ.get("WORKSPACE_NAME", "Volt")
    WORKSPACE_SLUG = os.environ.get("WORKSPACE_SLUG", "volt")
    PROJECT_NAME = os.environ.get("PROJECT_NAME", "Volt")
    PROJECT_ID = os.environ.get("PROJECT_IDENTIFIER", "VOLT")

    USERS_RAW = os.environ.get("PLANE_USERS", "")
    EMAILS = [e.strip() for e in USERS_RAW.strip().splitlines() if e.strip()]

    def username_from_email(email):
        return email.split("@")[0].replace(".", "-")

    def first_name_from_email(email):
        return email.split("@")[0].capitalize()

    # ── 1. Instance ──
    inst = Instance.objects.first()
    if inst:
        inst.is_setup_done = True
        inst.save(update_fields=["is_setup_done"])
    else:
        Instance.objects.create(
            instance_id=secrets.token_hex(16),
            current_version="0.23",
            is_setup_done=True,
        )
    sys.stderr.write("[OK] Instance setup_done=True\n")

    # ── 2. Users ──
    users = []
    for email in EMAILS:
        u, created = User.objects.get_or_create(
            email=email,
            defaults={
                "username": username_from_email(email),
                "first_name": first_name_from_email(email),
                "last_name": email.split("@")[1].split(".")[0].capitalize(),
                "is_active": True,
                "is_password_autoset": False,
            },
        )
        if created:
            u.set_password(PASSWORD)
            u.save()
        users.append(u)
        sys.stderr.write(f"[OK] User {email} (id={u.id}, new={created})\n")

    owner = users[0]

    # ── 3. Workspace ──
    ws, wc = Workspace.objects.get_or_create(
        slug=WORKSPACE_SLUG,
        defaults={"name": WORKSPACE_NAME, "owner": owner},
    )
    sys.stderr.write(f"[OK] Workspace {ws.slug} (id={ws.id}, new={wc})\n")

    # ── 4. Workspace members ──
    for i, u in enumerate(users):
        role = 20 if i == 0 else 15  # 20=Admin, 15=Member
        WorkspaceMember.objects.get_or_create(
            workspace=ws, member=u, defaults={"role": role}
        )
    sys.stderr.write(f"[OK] {len(users)} workspace members\n")

    # ── 5. Project ──
    proj, pc = Project.objects.get_or_create(
        workspace=ws,
        identifier=PROJECT_ID,
        defaults={
            "name": PROJECT_NAME,
            "created_by": owner,
            "default_assignee": owner,
            "network": 2,
        },
    )
    sys.stderr.write(f"[OK] Project {proj.name} (id={proj.id}, new={pc})\n")

    # ── 6. Project members ──
    for i, u in enumerate(users):
        role = 20 if i == 0 else 15
        ProjectMember.objects.get_or_create(
            project=proj, member=u, workspace=ws, defaults={"role": role}
        )
    sys.stderr.write(f"[OK] {len(users)} project members\n")

    # ── 7. API Token ──
    token, tc = APIToken.objects.get_or_create(
        user=owner, workspace=ws, label="chat-service",
        defaults={"token": secrets.token_hex(32)},
    )
    sys.stderr.write(f"\n{'='*60}\n")
    sys.stderr.write(f"PLANE_API_TOKEN={token.token}\n")
    sys.stderr.write(f"{'='*60}\n")
    sys.stderr.write("Update the plane-secrets Secret with this token.\n")
    sys.stderr.write("SETUP COMPLETE\n")
---
apiVersion: batch/v1
kind: Job
metadata:
  name: plane-init
  namespace: plane
  labels:
    app.kubernetes.io/name: plane-init
    app.kubernetes.io/part-of: plane
spec:
  backoffLimit: 5
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: plane-init
    spec:
      restartPolicy: OnFailure
      initContainers:
        # Wait for DB
        - name: wait-for-db
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z plane-db 5432; do sleep 2; done"]
        # Wait for API to be accepting requests (migrations done)
        - name: wait-for-api
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z plane-api 8000; do sleep 3; done; sleep 10"]
      containers:
        - name: init
          image: ghcr.io/volt-shared/volt-plane-backend:latest
          command:
            - python
            - manage.py
            - shell
            - -c
            - "exec(open('/scripts/init_plane.py').read())"
          envFrom:
            - configMapRef:
                name: plane-config
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: plane-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: plane-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: plane-secrets
                  key: POSTGRES_DB
            - name: DATABASE_URL
              value: "postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@plane-db:5432/$(POSTGRES_DB)"
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: plane-secrets
                  key: SECRET_KEY
            - name: USER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: plane-user-password
                  key: password
            - name: WORKSPACE_NAME
              valueFrom:
                configMapKeyRef:
                  name: plane-config
                  key: PLANE_WORKSPACE_NAME
            - name: WORKSPACE_SLUG
              valueFrom:
                configMapKeyRef:
                  name: plane-config
                  key: PLANE_WORKSPACE_SLUG
          volumeMounts:
            - name: scripts
              mountPath: /scripts
      volumes:
        - name: scripts
          configMap:
            name: plane-init-script
