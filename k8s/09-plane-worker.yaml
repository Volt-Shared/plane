apiVersion: apps/v1
kind: Deployment
metadata:
  name: plane-worker
  namespace: plane
  labels:
    app.kubernetes.io/name: plane-worker
    app.kubernetes.io/part-of: plane
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: plane-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: plane-worker
    spec:
      initContainers:
        - name: wait-for-api
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z plane-api 8000; do sleep 3; done"]
      containers:
        - name: worker
          image: ghcr.io/volt-shared/volt-plane-backend:latest
          command: ["./bin/docker-entrypoint-worker.sh"]
          envFrom:
            - configMapRef:
                name: plane-config
            - secretRef:
                name: plane-secrets
          env:
            - name: DATABASE_URL
              value: "postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@plane-db:5432/$(POSTGRES_DB)"
