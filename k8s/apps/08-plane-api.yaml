apiVersion: v1
kind: Service
metadata:
  name: plane-api
  namespace: plane
spec:
  ports:
    - port: 8000
      targetPort: 8000
  selector:
    app.kubernetes.io/name: plane-api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: plane-api
  namespace: plane
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: plane-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: plane-api
    spec:
      initContainers:
        - name: wait-for-db
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z plane-db 5432; do sleep 2; done"]
        - name: wait-for-redis
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z plane-redis 6379; do sleep 2; done"]
      containers:
        - name: api
          image: ghcr.io/volt-shared/volt-plane-backend:latest
          command: ["./bin/docker-entrypoint-api.sh"]
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef: { name: plane-config }
            - secretRef: { name: plane-secrets }
          env:
            - name: DATABASE_URL
              value: "postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@plane-db:5432/$(POSTGRES_DB)"